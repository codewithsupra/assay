databases:
  - name: assay-db-2
    plan: free
    postgresMajorVersion: "16"

services:
  # Render's free plan doesn't offer the "worker" service type, so there's no
  # free way to run the load-campaign runner (src/runner.js) as a separate
  # process here. SCHEDULER_JOB_TYPES makes this one web service poll both
  # probe and load_campaign jobs instead -- see src/index.js. If you upgrade
  # to a paid plan later, add a `type: worker` service running
  # `node src/runner.js` and drop `load_campaign` from this env var so load
  # generation moves off the request-serving process again.
  - type: web
    name: assay
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: assay-db-2
          property: connectionString
      - key: PUBLIC_BASE_URL
        sync: false # set to the assigned onrender.com URL after first deploy
      - key: SCHEDULER_JOB_TYPES
        value: probe,load_campaign
