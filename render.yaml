databases:
  - name: assay-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: assay
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: assay-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        sync: false # set to the assigned onrender.com URL after first deploy

  - type: worker
    name: assay-runner
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: node src/runner.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: assay-db
          property: connectionString
